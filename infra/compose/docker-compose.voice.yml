# Optional local voice endpoints, layered onto the normal Compose stack.
# docker compose --env-file .env -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.voice.yml up --build
# Configure these URLs from the API container's network, then keep the existing voice selection.
services:
  api:
    environment:
      VOICE_SPEECH_BASE_URL: ${VOICE_SPEECH_BASE_URL:-}
      VOICE_SPEECH_MODEL: ${VOICE_SPEECH_MODEL:-}
      VOICE_SPEECH_VOICE: ${VOICE_SPEECH_VOICE:-}
      VOICE_TRANSCRIPTION_URL: ${VOICE_TRANSCRIPTION_URL:-}
  worker:
    environment:
      VOICE_SPEECH_BASE_URL: ${VOICE_SPEECH_BASE_URL:-}
      VOICE_SPEECH_MODEL: ${VOICE_SPEECH_MODEL:-}
      VOICE_SPEECH_VOICE: ${VOICE_SPEECH_VOICE:-}
      VOICE_TRANSCRIPTION_URL: ${VOICE_TRANSCRIPTION_URL:-}
